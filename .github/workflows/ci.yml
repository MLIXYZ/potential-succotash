name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Prettier, ESLint, tsc, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfsu-ai-campus-assistant/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use the lockfile once one is committed; fall back to a fresh resolve until then.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sfsu-ai-campus-assistant/frontend/dist
          retention-days: 7

  backend:
    name: Backend (flake8, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfsu-ai-campus-assistant
    env:
      USE_MOCK_RAG: "true"
      USE_MOCK_CLAUDE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sfsu-ai-campus-assistant/backend/requirements*.txt

      # requirements-ml.txt (llama-cpp-python) is skipped: it compiles llama.cpp
      # and the tests never load the embedding model.
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: flake8
        run: flake8 backend rag

      - name: pytest
        working-directory: sfsu-ai-campus-assistant/backend
        run: pytest -v

  # When main is green, publish main + the built frontend as a new commit on the
  # `deploy` branch. Each deploy commit's first parent is the previous deploy
  # commit, so the server's `git pull --ff-only` (run.sh) always fast-forwards.
  deploy:
    name: Publish to deploy branch
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: sfsu-ai-campus-assistant/frontend/dist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          # dist/ is gitignored on main; force-add it for the deploy tree only.
          git add -f sfsu-ai-campus-assistant/frontend/dist
          tree=$(git write-tree)

          parents=()
          if git fetch --depth=1 origin deploy; then
            parents+=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          parents+=(-p "$GITHUB_SHA")

          commit=$(git commit-tree "$tree" "${parents[@]}" \
            -m "Deploy ${GITHUB_SHA::7} with built frontend")
          git push origin "$commit:refs/heads/deploy"
